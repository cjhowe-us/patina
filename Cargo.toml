[package]
name = "patina"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "patina"
path = "src/main.rs"

[lib]
name = "patina"
path = "src/lib.rs"

[dependencies]
hecs = "0.10.5"
pest = "2.7"
pest_derive = "2.7"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
